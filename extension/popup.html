<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copilot browser interaction</title>
    <style>
      body { font: 13px system-ui, sans-serif; margin: 16px; width: 300px; }
      h1 { align-items: center; display: flex; font-size: 15px; gap: 8px; margin: 0 0 12px; }
      h1 img { height: 24px; width: 24px; }
      label, p { display: block; margin: 10px 0; overflow-wrap: anywhere; }
      select, button { padding: 6px 10px; }
      select { display: block; margin-top: 5px; width: 100%; }
      button { margin-right: 6px; }
      .ok { color: #137333; }
      .off { color: #b3261e; }
    </style>
  </head>
  <body>
    <h1><img src="icons/icon32.png" alt="">Copilot browser interaction</h1>
    <p id="bridge">Checking local bridge…</p>
    <label>
      Approval method
      <select id="mode">
        <option value="site">Per site (safer)</option>
        <option value="tab">Per Copilot tab</option>
      </select>
    </label>
    <label>
      <input id="auto-approve" type="checkbox">
      Automatically allow tabs opened by Copilot
    </label>
    <p id="access">Checking current tab…</p>
    <button id="share" type="button">Share this tab with Copilot</button>
    <button id="grant" type="button">Allow</button>
    <button id="revoke" type="button">Revoke</button>
    <button id="unshare" type="button">Stop sharing</button>
    <script src="popup.js"></script>
  </body>
</html>
